# Configuration locale uniquement ; aucun projet distant ni secret.
project_id = "OnJoueQuand"

[api]
enabled = true
port = 55321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 55322
shadow_port = 55320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
# Ce champ active le fournisseur e-mail ; auth.enable_signup=false interdit les inscriptions.
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Votre code de connexion OnJoueQuand"
content_path = "./supabase/templates/code.html"

[auth.email.template.confirmation]
subject = "Votre accès à OnJoueQuand"
content_path = "./supabase/templates/code.html"

[auth.rate_limit]
email_sent = 100
sign_in_sign_ups = 30
token_verifications = 30

[realtime]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[edge_runtime]
enabled = false
