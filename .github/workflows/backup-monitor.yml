name: Surveillance indépendante des sauvegardes privées

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.event.repository.private == true && vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: node scripts/ops/backup-age.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
